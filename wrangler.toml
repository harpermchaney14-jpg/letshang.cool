name = "letshang-cool"
main = "src/index.js"
# Keep variables added in the Cloudflare dashboard (like FINNHUB_KEY) when GitHub deploys.
keep_vars = true
compatibility_date = "2025-09-01"

# Front end (HTML/CSS/JS) lives in ./public. /api/* always goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "lets-hang"
database_id = "d251a6e9-f50a-4e71-95c6-bd6f5d2c6d7a"   # from: npx wrangler d1 create lets-hang
migrations_dir = "migrations"

[vars]
TIMEZONE = "America/Chicago"   # used for dates/times in notifications and texts
APP_URL = "https://letshang.cool"   # public address (used to verify Twilio webhooks)

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM                    (your Twilio number, +1605...)  — or —
#   TWILIO_MESSAGING_SERVICE_SID   (recommended once A2P 10DLC is approved)

# Daily clean-up (data retention): old messages, notifications, sessions
[triggers]
crons = ["17 9 * * *"]

[observability]
enabled = true
