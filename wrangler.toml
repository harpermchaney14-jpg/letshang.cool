name = "lets-hang"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serve the app at https://letshang.cool (the domain must be in this Cloudflare account)
routes = [
  { pattern = "letshang.cool", custom_domain = true },
]

# Front end (HTML/CSS/JS) lives in ./public. /api/* always goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "lets-hang"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from: npx wrangler d1 create lets-hang
migrations_dir = "migrations"

[vars]
TIMEZONE = "America/Chicago"   # used for dates/times in notifications and texts
APP_URL = "https://letshang.cool"   # public address (used to verify Twilio webhooks)

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM                    (your Twilio number, +1605...)  — or —
#   TWILIO_MESSAGING_SERVICE_SID   (recommended once A2P 10DLC is approved)

# Daily clean-up (data retention): old messages, notifications, sessions
[triggers]
crons = ["17 9 * * *"]

[observability]
enabled = true
